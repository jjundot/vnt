syntax = "proto3";

package protocol.rpc;

enum ClientType {
  VNT = 0;
  IKEV2 = 1;
  WIREGUARD = 2;
}

message RpcMessageRequest{
  uint64 id = 1;
  oneof rpc_req_payload{
    ClientListRequest client_list_req = 2;
    BandwidthRequest bandwidth_req = 3;
  }
}

message ClientListRequest{

}



message RpcMessageResponse{
  uint64 id = 1;
  oneof rpc_res_payload{
    ClientListResponse client_list_res = 2;
    BandwidthResponse bandwidth_res = 3;
  }
}

message ClientInfo{
  string name = 1;
  string version = 2;
  fixed32 ip = 3;
  optional string key_sign = 4;
  bool online = 5;
  int64 last_connected_time = 6;
  string id = 7;
  ClientType client_type = 8;
}

message ClientListResponse{
  repeated ClientInfo list = 1;
}

// Versioned JSON envelope; unknown RPC tags remain compatible with old peers.
message BandwidthRequest { bytes json = 1; }
message BandwidthResponse { bytes json = 1; }
